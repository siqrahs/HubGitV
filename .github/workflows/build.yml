name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Pilih jenis build APK'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: |
          SELECTED_BUILD="${{ inputs.build_type }}"
          if [ "$SELECTED_BUILD" = "release" ]; then
            echo "Memulai proses build Release APK..."
            ./gradlew assembleRelease --stacktrace
          else
            echo "Memulai proses build Debug APK..."
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HubGitV-APK
          path: app/build/outputs/apk/**/*.apk
          retention-days: 7
